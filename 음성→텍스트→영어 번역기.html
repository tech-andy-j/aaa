<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 → 텍스트 → 영어 번역</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    max-width: 960px; margin: 0 auto; padding: 32px 20px;
    background: #f5f6f8; color: #1a1a1a;
  }
  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
  #uiToggle { background:#fff; border:1px solid #d1d5db; color:#374151;
    font-size:12px; padding:6px 12px; border-radius:999px; font-weight:600; cursor:pointer; }
  .panel { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  button { font-size:15px; padding:10px 18px; border:none; border-radius:8px; cursor:pointer; font-weight:600; transition:.15s; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #startBtn { background:#2563eb; color:#fff; }
  #startBtn.rec { background:#dc2626; }
  #stopBtn,#clearBtn,#copyBtn,#dlBtn,#transBtn { background:#e5e7eb; color:#111; }
  #transBtn { background:#059669; color:#fff; }
  select { padding:9px 10px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; }
  label.chk { font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer; }
  #status { font-size:13px; color:#555; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#9ca3af; }
  .dot.on { background:#dc2626; animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
  .box h3 { font-size:13px; margin:0 0 6px; color:#6b7280; font-weight:700; letter-spacing:.3px; }
  .area {
    min-height:230px; border:1px solid #e5e7eb; border-radius:10px; padding:14px;
    font-size:16px; line-height:1.75; background:#fafafa; white-space:pre-wrap;
    overflow-y:auto; max-height:420px;
  }
  #transOut { background:#f0fdf4; border-color:#bbf7d0; }
  .interim { color:#9ca3af; }
  .meta { margin-top:10px; font-size:13px; color:#777; }
  .bar { height:6px; background:#e5e7eb; border-radius:4px; overflow:hidden; margin-top:10px; display:none; }
  .bar > i { display:block; height:100%; width:0; background:#059669; transition:width .2s; }
  .warn { background:#fef3c7; border:1px solid #fde68a; color:#92400e;
    padding:12px 14px; border-radius:8px; font-size:14px; margin-top:18px; }
  .info { background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af;
    padding:12px 14px; border-radius:8px; font-size:13px; margin-top:16px; line-height:1.6; }
</style>
</head>
<body>

<div class="head">
  <div>
    <h1 id="t-title">음성 → 텍스트 → 영어 번역</h1>
    <p class="sub" id="t-sub">Web Speech API + 브라우저 내장 Translator API · 외부 API 키 없음 · 전부 온디바이스</p>
  </div>
  <button id="uiToggle">EN</button>
</div>

<div class="panel">
  <div class="controls">
    <button id="startBtn">● <span id="t-start">녹음 시작</span></button>
    <button id="stopBtn" disabled>■ <span id="t-stop">중지</span></button>

    <select id="lang" title="인식 언어">
      <optgroup label="한국어 / Korean"><option value="ko-KR" selected>한국어</option></optgroup>
      <optgroup label="English">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="en-AU">English (AU)</option>
        <option value="en-IN">English (IN)</option>
      </optgroup>
      <optgroup label="Others">
        <option value="ja-JP">日本語</option>
        <option value="zh-CN">中文 (简体)</option>
        <option value="es-ES">Español</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
        <option value="vi-VN">Tiếng Việt</option>
      </optgroup>
    </select>

    <select id="target" title="번역 대상 언어">
      <option value="en" selected>→ English</option>
      <option value="ko">→ 한국어</option>
      <option value="ja">→ 日本語</option>
      <option value="zh">→ 中文</option>
      <option value="es">→ Español</option>
      <option value="fr">→ Français</option>
      <option value="de">→ Deutsch</option>
    </select>

    <label class="chk"><input type="checkbox" id="continuous" checked> <span id="t-cont">연속 인식</span></label>
    <label class="chk"><input type="checkbox" id="autoTrans" checked> <span id="t-auto">실시간 번역</span></label>

    <button id="transBtn"><span id="t-trans">전체 번역</span></button>
    <button id="copyBtn"><span id="t-copy">복사</span></button>
    <button id="dlBtn"><span id="t-dl">.txt 저장</span></button>
    <button id="clearBtn"><span id="t-clear">지우기</span></button>
  </div>

  <div id="status"><span class="dot" id="dot"></span><span id="statusText">대기 중</span></div>
  <div class="bar" id="bar"><i id="barFill"></i></div>

  <div class="grid" style="margin-top:12px">
    <div class="box">
      <h3 id="t-h-src">원문 (SOURCE)</h3>
      <div class="area" id="output"></div>
    </div>
    <div class="box">
      <h3 id="t-h-tgt">번역 (TRANSLATION)</h3>
      <div class="area" id="transOut"></div>
    </div>
  </div>

  <div class="meta"><span id="t-count">글자 수</span>: <b id="charCount">0</b> · <span id="t-words">단어</span>: <b id="wordCount">0</b></div>
</div>

<div class="warn" id="warnBox" style="display:none"></div>
<div class="info" id="infoBox" style="display:none"></div>

<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = id => document.getElementById(id);
  const startBtn=$('startBtn'), stopBtn=$('stopBtn'), output=$('output'),
        transOut=$('transOut'), statusText=$('statusText'), dot=$('dot'),
        langSel=$('lang'), targetSel=$('target'), contChk=$('continuous'),
        autoChk=$('autoTrans'), transBtn=$('transBtn');

  /* ================= i18n ================= */
  const I18N = {
    ko: {
      title:'음성 → 텍스트 → 영어 번역',
      sub:'Web Speech API + 브라우저 내장 Translator API · 외부 API 키 없음 · 전부 온디바이스',
      start:'녹음 시작', stop:'중지', cont:'연속 인식', auto:'실시간 번역',
      trans:'전체 번역', copy:'복사', dl:'.txt 저장', clear:'지우기',
      count:'글자 수', words:'단어', hSrc:'원문 (SOURCE)', hTgt:'번역 (TRANSLATION)',
      idle:'대기 중', listening:'듣는 중... 말씀하세요',
      copied:'클립보드에 복사되었습니다.', copyFail:'복사 실패 (HTTPS 환경에서만 동작)',
      unsupported:'이 브라우저는 Web Speech API를 지원하지 않습니다. Chrome 또는 Edge 최신 버전을 사용해 주세요.',
      noTrans:'이 브라우저는 내장 Translator API를 지원하지 않습니다. 음성 인식은 정상 동작하며, 번역 기능만 비활성화됩니다. (Chrome 138+ / Edge 148+ 데스크톱에서 사용 가능)',
      sameLang:'원문과 번역 대상 언어가 같습니다.',
      pairNo:'이 언어 쌍은 지원되지 않습니다.',
      dlModel:'번역 모델 다운로드 중...',
      ready:'번역 모델 준비 완료.',
      translating:'번역 중...',
      err:{'no-speech':'음성이 감지되지 않았습니다.','audio-capture':'마이크를 찾을 수 없습니다.',
           'not-allowed':'마이크 권한이 거부되었습니다.','network':'네트워크 오류가 발생했습니다.'},
      switched:l=>'인식 언어를 '+l+' (으)로 변경했습니다.'
    },
    en: {
      title:'Speech → Text → Translation',
      sub:'Web Speech API + built-in Translator API · No external key · Fully on-device',
      start:'Start', stop:'Stop', cont:'Continuous', auto:'Live translate',
      trans:'Translate all', copy:'Copy', dl:'Save .txt', clear:'Clear',
      count:'Characters', words:'Words', hSrc:'SOURCE', hTgt:'TRANSLATION',
      idle:'Idle', listening:'Listening... please speak',
      copied:'Copied to clipboard.', copyFail:'Copy failed (requires HTTPS).',
      unsupported:'This browser does not support the Web Speech API. Use the latest Chrome or Edge.',
      noTrans:'Built-in Translator API is unavailable. Speech recognition still works; translation is disabled. (Requires Chrome 138+ / Edge 148+ desktop)',
      sameLang:'Source and target languages are identical.',
      pairNo:'This language pair is not supported.',
      dlModel:'Downloading translation model...',
      ready:'Translation model ready.',
      translating:'Translating...',
      err:{'no-speech':'No speech detected.','audio-capture':'No microphone found.',
           'not-allowed':'Microphone permission denied.','network':'A network error occurred.'},
      switched:l=>'Recognition language switched to '+l+'.'
    }
  };
  let ui='ko'; const T=()=>I18N[ui];

  function applyUI(){
    const t=T(); document.documentElement.lang=ui;
    [['t-title','title'],['t-sub','sub'],['t-start','start'],['t-stop','stop'],
     ['t-cont','cont'],['t-auto','auto'],['t-trans','trans'],['t-copy','copy'],
     ['t-dl','dl'],['t-clear','clear'],['t-count','count'],['t-words','words'],
     ['t-h-src','hSrc'],['t-h-tgt','hTgt']].forEach(([id,k])=>$(id).textContent=t[k]);
    $('uiToggle').textContent = ui==='ko' ? 'EN' : '한국어';
    if (stopBtn.disabled) statusText.textContent=t.idle;
  }
  $('uiToggle').addEventListener('click',()=>{ ui=(ui==='ko')?'en':'ko'; applyUI(); });
  applyUI();

  if(!SR){
    $('warnBox').style.display='block';
    $('warnBox').textContent=T().unsupported;
    startBtn.disabled=true;
  }

  /* ========== Translator API (on-device) ========== */
  const HAS_TRANSLATOR = ('Translator' in self);
  if(!HAS_TRANSLATOR){
    $('infoBox').style.display='block';
    $('infoBox').textContent=T().noTrans;
    transBtn.disabled=true; autoChk.checked=false; autoChk.disabled=true;
  }

  let translator=null, translatorKey='';

  const baseLang = bcp47 => bcp47.split('-')[0];     // 'ko-KR' → 'ko'

  function setProgress(p){
    const bar=$('bar');
    if(p===null){ bar.style.display='none'; return; }
    bar.style.display='block'; $('barFill').style.width=Math.round(p*100)+'%';
  }

  /** 소스/타깃 쌍에 맞는 translator 확보 (필요 시 모델 다운로드) */
  async function getTranslator(){
    const src=baseLang(langSel.value), tgt=targetSel.value;
    if(src===tgt) throw new Error(T().sameLang);
    const key=src+'>'+tgt;
    if(translator && translatorKey===key) return translator;

    const options={ sourceLanguage:src, targetLanguage:tgt };
    const availability=await Translator.availability(options);
    if(availability==='unavailable') throw new Error(T().pairNo);

    if(availability!=='available'){ statusText.textContent=T().dlModel; setProgress(0); }

    translator = await Translator.create({
      ...options,
      monitor(m){
        m.addEventListener('downloadprogress', e=>{
          setProgress(e.loaded);
          statusText.textContent = T().dlModel+' '+Math.round(e.loaded*100)+'%';
        });
      }
    });
    if(translator.ready) await translator.ready;
    translatorKey=key; setProgress(null);
    statusText.textContent=T().ready;
    return translator;
  }

  /* 번역 큐 — 문장 단위로 들어온 순서대로 직렬 처리 */
  let queue=Promise.resolve();
  let translatedText='';

  function enqueueTranslate(sentence){
    if(!HAS_TRANSLATOR || !autoChk.checked || !sentence.trim()) return;
    queue = queue.then(async ()=>{
      try{
        const tr=await getTranslator();
        const out=await tr.translate(sentence.trim());
        translatedText += out.trim()+' ';
        renderTrans();
      }catch(err){ statusText.textContent=err.message; }
    });
  }

  function renderTrans(){
    transOut.textContent=translatedText;
    transOut.scrollTop=transOut.scrollHeight;
  }

  /* 전체 번역 버튼 — 원문 전체를 한 번에 */
  transBtn.addEventListener('click', async ()=>{
    if(!finalText.trim()) return;
    statusText.textContent=T().translating;
    try{
      const tr=await getTranslator();
      translatedText=(await tr.translate(finalText.trim()))+' ';
      renderTrans();
      statusText.textContent=T().idle;
    }catch(err){ statusText.textContent=err.message; }
  });

  /* 언어 쌍이 바뀌면 translator 캐시 무효화 */
  targetSel.addEventListener('change', ()=>{ translator=null; translatorKey=''; });

  /* ================= Speech Recognition ================= */
  let recognition=null, finalText='', manualStop=false;
  const escapeHtml = s => s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  function render(interim){
    output.innerHTML = escapeHtml(finalText) +
      (interim ? '<span class="interim">'+escapeHtml(interim)+'</span>' : '');
    output.scrollTop=output.scrollHeight;
    $('charCount').textContent=finalText.length;
    $('wordCount').textContent=finalText.trim()?finalText.trim().split(/\s+/).length:0;
  }

  function setRecording(on){
    startBtn.disabled=on; stopBtn.disabled=!on;
    startBtn.classList.toggle('rec',on); dot.classList.toggle('on',on);
    statusText.textContent = on ? T().listening : T().idle;
  }

  function postProcess(txt, lang){
    txt=txt.trim(); if(!txt) return '';
    if(lang.startsWith('en')){
      txt=txt.charAt(0).toUpperCase()+txt.slice(1);
      if(!/[.!?]$/.test(txt)) txt+='.';
    }
    return txt;
  }

  function createRecognition(){
    const r=new SR();
    r.lang=langSel.value; r.continuous=contChk.checked;
    r.interimResults=true; r.maxAlternatives=1;

    r.onstart=()=>setRecording(true);

    r.onresult=e=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const txt=e.results[i][0].transcript;
        if(e.results[i].isFinal){
          const s=postProcess(txt,r.lang);
          if(s){ finalText += s+' '; enqueueTranslate(s); }   // 확정 문장만 번역
        } else interim+=txt;
      }
      render(interim);
    };

    r.onerror=e=>{
      statusText.textContent=T().err[e.error]||('Error: '+e.error);
      if(e.error==='not-allowed'||e.error==='audio-capture') manualStop=true;
    };

    r.onend=()=>{
      if(!manualStop && contChk.checked){ try{ r.start(); return; }catch(_){} }
      setRecording(false);
    };
    return r;
  }

  function startRec(){
    manualStop=false; recognition=createRecognition();
    try{ recognition.start(); }
    catch(err){ statusText.textContent='Start failed: '+err.message; }
  }

  startBtn.addEventListener('click', async ()=>{
    // 사용자 제스처 안에서 모델 다운로드를 미리 트리거
    if(HAS_TRANSLATOR && autoChk.checked){
      try{ await getTranslator(); }catch(_){}
    }
    startRec();
  });

  stopBtn.addEventListener('click',()=>{ manualStop=true; if(recognition) recognition.stop(); });

  langSel.addEventListener('change',()=>{
    translator=null; translatorKey='';
    const label=langSel.options[langSel.selectedIndex].text;
    if(!stopBtn.disabled && recognition){
      manualStop=true;
      recognition.onend=()=>{ setRecording(false); startRec(); };
      recognition.stop();
    }
    statusText.textContent=T().switched(label);
  });

  $('clearBtn').addEventListener('click',()=>{
    finalText=''; translatedText=''; render(''); renderTrans();
  });

  $('copyBtn').addEventListener('click', async ()=>{
    const txt = translatedText.trim() || finalText.trim();
    if(!txt) return;
    try{ await navigator.clipboard.writeText(txt); statusText.textContent=T().copied; }
    catch(_){ statusText.textContent=T().copyFail; }
  });

  $('dlBtn').addEventListener('click',()=>{
    if(!finalText.trim()) return;
    const body =
      '[SOURCE: '+langSel.value+']\n'+finalText.trim()+
      '\n\n[TRANSLATION: '+targetSel.value+']\n'+translatedText.trim();
    const blob=new Blob([body],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='transcript-'+Date.now()+'.txt';
    a.click(); URL.revokeObjectURL(a.href);
  });
})();
</script>

</body>
</html>
